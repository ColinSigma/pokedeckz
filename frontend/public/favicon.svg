      <stop offset="0%" stopColor="#FF4D4D" />
      <stop offset="100%" stopColor="#D32F2F" />
    </linearGradient>
    <linearGradient id="favPika" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFEB3B" />
      <stop offset="100%" stopColor="#FBC02D" />
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <path d="M 32 34 L 14 6 C 12 3, 8 6, 11 11 L 24 40 Z" fill="url(#favPika)" stroke="#1E1E1E" stroke-width="2"/>
