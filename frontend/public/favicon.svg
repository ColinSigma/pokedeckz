  <path d="M 86 6 L 81 15 L 88 18 C 90 13, 90 8, 86 6 Z" fill="#1E1E1E"/>

  <!-- Poké Ball Bottom (White) -->
  <path d="M 18 56 A 32 32 0 0 0 82 56 Z" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="3.5"/>

  <!-- Poké Ball Top (Red) -->
