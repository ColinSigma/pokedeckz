  <!-- Center Button -->
  <circle cx="50" cy="56" r="10" fill="#1E1E1E"/>
  <circle cx="50" cy="56" r="6" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
  <circle cx="50" cy="56" r="2.5" fill="#00E5FF"/>

  <!-- Ash's Cap Dome -->
