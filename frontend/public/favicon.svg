  <path d="M 36 36 C 36 24, 64 24, 64 36 Z" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="1.5"/>
  <!-- Cap Logo -->
  <path d="M 46 29 A 4 4 0 0 1 54 29" stroke="#00897B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cap Visor -->
  <path d="M 24 37 Q 50 43 76 37 Q 50 47 24 37 Z" fill="#B71C1C" stroke="#1E1E1E" stroke-width="2.5"/>
